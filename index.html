<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosquée de Villeneuve-sur-Lot</title>
<script src="https://praytimes.org/code/praytime/dist/praytime.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 28px;
    }

    .card {
      margin: 20px auto;
      padding: 20px;
      max-width: 300px;
      background: #121a2b;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .time {
      font-size: 32px;
      margin: 10px 0;
      color: #8b5cf6;
    }

    .next {
      margin-top: 30px;
      font-size: 18px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <h1>Mosquée de Villeneuve-sur-Lot</h1>

  <div class="card">
    <div>Fajr</div>
<div class="time" id="fajr">--:--</div>
  </div>

  <div class="card">
    <div>Dhuhr</div>
<div class="time" id="dhuhr">--:--</div>
  </div>

  <div class="card">
    <div>Asr</div>
    <div class="time">16:09</div>
  </div>

  <div class="card">
    <div>Maghrib</div>
    <div class="time">18:34</div>
  </div>

  <div class="card">
    <div>Isha</div>
    <div class="time">20:07</div>
  </div>

  <div class="next">
    Première version de l’app 🕌
  </div>
<script>
const prayers = [
  { name: "Fajr", time: "06:35" },
  { name: "Dhuhr", time: "13:21" },
  { name: "Asr", time: "16:09" },
  { name: "Maghrib", time: "18:34" },
  { name: "Isha", time: "20:07" }
];

function getNextPrayer() {
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  for (let p of prayers) {
    const [h, m] = p.time.split(":").map(Number);
    const prayerMinutes = h * 60 + m;

    if (prayerMinutes > currentMinutes) {
      return `${p.name} à ${p.time}`;
    }
  }

  return `Fajr à ${prayers[0].time} (demain)`;
}

const nextDiv = document.createElement("div");
nextDiv.style.marginTop = "30px";
nextDiv.style.fontSize = "20px";
nextDiv.innerText = "Prochaine prière : " + getNextPrayer();

document.body.appendChild(nextDiv);
</script>
<script>
const PT = new PrayTimes('MWL');

function updateTimes() {
  const date = new Date();
  const coords = [44.408, 0.704]; // Villeneuve-sur-Lot

  const times = PT.getTimes(date, coords);

  document.getElementById("fajr").innerText = times.fajr;
  document.getElementById("dhuhr").innerText = times.dhuhr;
  document.getElementById("asr").innerText = times.asr;
  document.getElementById("maghrib").innerText = times.maghrib;
  document.getElementById("isha").innerText = times.isha;
}

updateTimes();
</script>
</body>
</html>
