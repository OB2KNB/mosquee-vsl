<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosquée de Villeneuve-sur-Lot</title>
<script src="https://praytimes.org/code/v2/js/PrayTimes.js"></script>
  <style>
  <script>
document.getElementById("fajr").innerText = "TEST";

if (typeof PrayTimes === "function") {
  document.getElementById("dhuhr").innerText = "PrayTimes OK";
} else {
  document.getElementById("dhuhr").innerText = "PrayTimes PAS CHARGÉ";
}
</script>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 28px;
    }

    .card {
      margin: 20px auto;
      padding: 20px;
      max-width: 300px;
      background: #121a2b;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .time {
      font-size: 32px;
      margin: 10px 0;
      color: #8b5cf6;
    }

    .next {
      margin-top: 30px;
      font-size: 18px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <h1>Mosquée de Villeneuve-sur-Lot</h1>
<div style="max-width:320px;margin:10px auto 20px;">
<label style="display:block;margin-bottom:6px;opacity:.85;">Angle (France)</label>
<select id="angle" style="width:100%;padding:12px;border-radius:12px;border:0;background:#121a2b;color:white;">
<option value="12">12°</option>
<option value="15">15°</option>
<option value="18">18°</option>
</select>
</div>
<div id="nextBox" style="max-width:320px;margin:10px auto 20px;padding:14px;border-radius:14px;background:#121a2b;">
  <div style="opacity:.8;font-size:14px;">Prochaine prière</div>
  <div id="nextPrayer" style="font-size:20px;margin-top:6px;">--</div>
  <div id="countdown" style="font-size:28px;margin-top:6px;color:#8b5cf6;">--:--:--</div>
</div>
 <div class="card">
  <div>Fajr</div>
  <div class="time" id="fajr">--:--</div>
  <div class="iqama" id="iqama-fajr">Iqama: --:--</div>
</div>

 <div class="card">
  <div>Dhuhr</div>
  <div class="time" id="dhuhr">--:--</div>
  <div class="iqama" id="iqama-dhuhr">Iqama: --:--</div>
</div>

 <div class="card">
  <div>Asr</div>
  <div class="time" id="asr">--:--</div>
  <div class="iqama" id="iqama-asr">Iqama: --:--</div>
</div>

 <div class="card">
  <div>Maghrib</div>
  <div class="time" id="maghrib">--:--</div>
  <div class="iqama" id="iqama-maghrib">Iqama: --:--</div>
</div>

 <div class="card">
  <div>Isha</div>
  <div class="time" id="isha">--:--</div>
  <div class="iqama" id="iqama-isha">Iqama: --:--</div>
</div>

  <div class="next">
    Première version de l’app 🕌
  </div>
<script>


function getNextPrayer() {
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  for (let p of prayers) {
    const [h, m] = p.time.split(":").map(Number);
    const prayerMinutes = h * 60 + m;

    if (prayerMinutes > currentMinutes) {
      return `${p.name} à ${p.time}`;
    }
  }

  return `Fajr à ${prayers[0].time} (demain)`;
}

const nextDiv = document.createElement("div");
nextDiv.style.marginTop = "30px";
nextDiv.style.fontSize = "20px";
nextDiv.innerText = "Prochaine prière : " + getNextPrayer();

document.body.appendChild(nextDiv);
</script>
<script>
const PT = new PrayTimes('MWL');

function getAngle() {
  return document.getElementById("angle").value;
}

function updateTimes() {
  const date = new Date();
  const coords = [44.408, 0.704]; // Villeneuve-sur-Lot

PT.adjust({ fajr: getAngle(), isha: getAngle() });
const times = PT.getTimes(date, coords);

  document.getElementById("fajr").innerText = times.fajr;
  document.getElementById("dhuhr").innerText = times.dhuhr;
  document.getElementById("asr").innerText = times.asr;
  document.getElementById("maghrib").innerText = times.maghrib;
  document.getElementById("isha").innerText = times.isha;
  startCountdown(times);
}
let countdownTimer = null;

function hhmmToDate(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}

function formatHMS(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = String(Math.floor(total / 3600)).padStart(2, "0");
  const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
  const s = String(total % 60).padStart(2, "0");
  return `${h}:${m}:${s}`;
}

function startCountdown(times) {
  const order = [
    { key: "fajr", name: "Fajr" },
    { key: "dhuhr", name: "Dhuhr" },
    { key: "asr", name: "Asr" },
    { key: "maghrib", name: "Maghrib" },
    { key: "isha", name: "Isha" },
  ];

  const now = new Date();
  let next = null;

  for (const p of order) {
    const target = hhmmToDate(times[p.key]);
    if (target > now) {
      next = { ...p, at: target, time: times[p.key], tomorrow: false };
      break;
    }
  }

  if (!next) {
    const tomorrowFajr = hhmmToDate(times.fajr);
    tomorrowFajr.setDate(tomorrowFajr.getDate() + 1);
    next = { key: "fajr", name: "Fajr", at: tomorrowFajr, time: times.fajr, tomorrow: true };
  }

  document.getElementById("nextPrayer").innerText =
    `${next.name} à ${next.time}` + (next.tomorrow ? " (demain)" : "");

  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    document.getElementById("countdown").innerText = formatHMS(next.at - new Date());
  }, 1000);
}
function getAngle() {
  return Number(document.getElementById("angle").value);
}
updateTimes();
document.getElementById("angle").addEventListener("change", () => {
  updateTimes();
});
</script>
</body>
</html>
